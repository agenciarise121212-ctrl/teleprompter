<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TP RISE - Teleprompter Mágico</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        html, body {
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        .teleprompter-text {
            line-height: 1.6;
            transform-origin: top center;
        }
        .scene-badge {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            padding: 4px 12px;
            border-radius: 9999px;
            font-weight: bold;
            display: inline-block;
            margin: 16px 0 8px 0;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
            letter-spacing: 0.05em;
        }
        .audio-cue {
            color: #f87171;
            font-weight: 600;
            background: rgba(248, 113, 113, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border-left: 3px solid #f87171;
            display: inline-block;
            margin: 4px 0;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .controls-fade {
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
        }
        .hidden-controls {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .reading-guide {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(239, 68, 68, 0.4);
            pointer-events: none;
            transform: translateY(-50%);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }
        .reading-guide::before, .reading-guide::after {
            content: '';
            position: absolute;
            top: -4px;
            width: 0;
            height: 0;
            border-style: solid;
        }
        .reading-guide::before {
            left: 10px;
            border-width: 5px 0 5px 8px;
            border-color: transparent transparent transparent #ef4444;
        }
        .reading-guide::after {
            right: 10px;
            border-width: 5px 8px 5px 0;
            border-color: transparent #ef4444 transparent transparent;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden bg-black select-none">

    <div id="app-container" class="relative w-full h-full flex flex-col justify-between overflow-hidden">

        <!-- Área de Exibição / Leitura do Teleprompter (Inicia direto suavemente) -->
        <div id="prompter-viewport" class="absolute inset-0 overflow-y-auto no-scrollbar px-6 py-20 flex flex-col items-center">
            <div id="content-spacer-top" class="w-full" style="height: 35vh;"></div>
            
            <div id="prompter-text-area" class="teleprompter-text w-full max-w-3xl text-left text-3xl md:text-5xl font-medium text-gray-100 space-y-6 pb-48">
                <!-- Conteúdo inicial -->
            </div>

            <div id="content-spacer-bottom" class="w-full" style="height: 50vh;"></div>
        </div>

        <div class="reading-guide"></div>

        <!-- Controles Flutuantes (Sumem após 3s ao iniciar / reaparecem ao tocar na tela) -->
        <div id="action-controls" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 md:p-6 z-50 controls-fade">
            
            <!-- Barra Superior -->
            <div class="pointer-events-auto flex items-center justify-between bg-black/60 backdrop-blur-md px-4 py-3 rounded-2xl border border-white/10 shadow-2xl">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
                        <i class="fa-solid fa-wand-magic-sparkles text-white text-sm"></i>
                    </div>
                    <div>
                        <h1 class="text-sm font-bold tracking-wider text-white">TP RISE</h1>
                        <p class="text-[10px] text-purple-300">Roteiro Mágico Pro</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="openEditorModal()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center text-white transition" title="Editar Roteiro">
                        <i class="fa-solid fa-pen-to-square text-sm"></i>
                    </button>
                    <button onclick="toggleFullscreen()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center text-white transition" title="Tela Cheia">
                        <i class="fa-solid fa-expand text-sm"></i>
                    </button>
                </div>
            </div>

            <!-- Barra Inferior de Ação -->
            <div class="pointer-events-auto flex flex-col space-y-3 bg-black/70 backdrop-blur-lg p-4 rounded-3xl border border-white/10 shadow-2xl max-w-xl mx-auto w-full">
                
                <div class="flex items-center justify-between px-2 text-xs text-gray-300">
                    <div class="flex items-center space-x-2">
                        <span class="text-purple-400 font-semibold"><i class="fa-solid fa-gauge-high mr-1"></i> Vel:</span>
                        <button onclick="adjustSpeed(-0.5)" class="w-7 h-7 bg-white/10 rounded-lg hover:bg-white/20 font-bold">-</button>
                        <span id="speed-display" class="w-8 text-center font-bold text-white">1.0x</span>
                        <button onclick="adjustSpeed(0.5)" class="w-7 h-7 bg-white/10 rounded-lg hover:bg-white/20 font-bold">+</button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-purple-400 font-semibold"><i class="fa-solid fa-text-height mr-1"></i> Tam:</span>
                        <button onclick="adjustFontSize(-4)" class="w-7 h-7 bg-white/10 rounded-lg hover:bg-white/20 font-bold">-</button>
                        <span id="fontsize-display" class="w-8 text-center font-bold text-white">36</span>
                        <button onclick="adjustFontSize(4)" class="w-7 h-7 bg-white/10 rounded-lg hover:bg-white/20 font-bold">+</button>
                    </div>
                </div>

                <div class="flex items-center justify-center space-x-3">
                    <button onclick="resetPrompter()" class="w-12 h-12 rounded-2xl bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center text-white transition" title="Reiniciar">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    
                    <button id="play-pause-btn" onclick="togglePlay()" class="flex-1 h-14 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 active:scale-95 flex items-center justify-center space-x-2 text-white font-bold text-lg shadow-lg shadow-purple-600/40 transition">
                        <i id="play-icon" class="fa-solid fa-play"></i>
                        <span id="play-text">INICIAR</span>
                    </button>

                    <button onclick="openMagicWizard()" class="h-14 px-5 rounded-2xl bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 active:scale-95 flex items-center space-x-2 text-white font-bold shadow-lg shadow-pink-600/30 transition">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span class="hidden sm:inline">Mágico</span>
                    </button>
                </div>
            </div>

        </div>

        <!-- Modal de Limpeza do Roteiro Mágico -->
        <div id="editor-modal" class="absolute inset-0 bg-black/90 backdrop-blur-xl z-[100] hidden flex flex-col p-4 md:p-8">
            <div class="flex items-center justify-between pb-4 border-b border-white/10">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-pink-600 flex items-center justify-center">
                        <i class="fa-solid fa-wand-magic-sparkles text-white"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white">Roteiro Mágico & Editor</h2>
                        <p class="text-xs text-purple-300">Cole seu roteiro bruto para limpeza automática</p>
                    </div>
                </div>
                <button onclick="closeEditorModal()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="flex-1 flex flex-col md:flex-row gap-4 pt-4 overflow-hidden">
                <div class="flex-1 flex flex-col">
                    <label class="text-xs font-semibold text-purple-300 mb-2 flex justify-between items-center">
                        <span>COLE SEU ROTEIRO ABAIXO:</span>
                        <button onclick="applyMagicWizardClean()" class="px-3 py-1 bg-purple-600 hover:bg-purple-500 text-white rounded-lg text-xs font-bold shadow transition">
                            <i class="fa-solid fa-bolt mr-1"></i> Executar Roteiro Mágico
                        </button>
                    </label>
                    <textarea id="raw-script-input" class="flex-1 w-full bg-neutral-900 border border-white/10 rounded-2xl p-4 text-white text-sm focus:outline-none focus:border-purple-500 resize-none font-mono" placeholder="Ex: CENA 01... ÁUDIO: ..."></textarea>
                </div>
            </div>

            <div class="flex justify-end pt-4 border-t border-white/10 space-x-3">
                <button onclick="closeEditorModal()" class="px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 font-bold text-sm text-white transition">Cancelar</button>
                <button onclick="saveAndApplyScript()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 font-bold text-sm text-white shadow-lg shadow-purple-600/30 transition">Salvar e Carregar</button>
            </div>
        </div>

    </div>

    <script>
        let isPlaying = false;
        let scrollSpeed = 1.0;
        let fontSize = 36;
        let animationFrameId = null;
        let hideControlsTimeout = null;
        let controlsVisible = true;

        let defaultScript = `CENA 01: Abertura
ÁUDIO: Seja muito bem-vindo ao TP RISE, o teleprompter profissional otimizado para celulares e tablets.

CENA 02: O Roteiro Mágico
ÁUDIO: Com o nosso sistema inteligente, você cola seu roteiro e ele limpa tags automaticamente sem erros de formato.

CENA 03: Pronto para Gravar
ÁUDIO: Toque na tela para ocultar os botões e comece sua gravação com total perfeição.`;

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedScript();
            setupTouchAndClickHandlers();
            startHideControlsTimer();
            applyFontSize();
        });

        function loadSavedScript() {
            const saved = localStorage.getItem('tp_rise_script');
            if (saved) {
                renderPrompterContent(saved);
                document.getElementById('raw-script-input').value = saved;
            } else {
                renderPrompterContent(defaultScript);
                document.getElementById('raw-script-input').value = defaultScript;
            }
        }

        function cleanMagicScript(rawText) {
            if (!rawText || typeof rawText !== 'string') return '';
            
            let lines = rawText.split('\n');
            let formattedHtml = '';

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;

                if (/^(cena\s*\d+|cenas?\s*\d+)/i.test(trimmed)) {
                    formattedHtml += `<div class="w-full text-center my-6"><span class="scene-badge"><i class="fa-solid fa-clapperboard mr-2"></i>${escapeHtml(trimmed)}</span></div>`;
                } 
                else if (/^(áudio|audio|fala|locução|locucao)\s*:/i.test(trimmed)) {
                    let textContent = trimmed.replace(/^(áudio|audio|fala|locução|locucao)\s*:/i, '').trim();
                    if (textContent) {
                        formattedHtml += `<p class="mb-6"><span class="audio-cue mr-2">FALA:</span>${escapeHtml(textContent)}</p>`;
                    }
                } 
                else {
                    if (trimmed.toUpperCase().startsWith('CENA')) {
                        formattedHtml += `<div class="w-full text-center my-6"><span class="scene-badge"><i class="fa-solid fa-clapperboard mr-2"></i>${escapeHtml(trimmed)}</span></div>`;
                    } else {
                        formattedHtml += `<p class="mb-6 text-gray-200">${escapeHtml(trimmed)}</p>`;
                    }
                }
            });

            return formattedHtml;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderPrompterContent(text) {
            const container = document.getElementById('prompter-text-area');
            container.innerHTML = cleanMagicScript(text);
        }

        function applyMagicWizardClean() {
            const rawInput = document.getElementById('raw-script-input').value;
            const cleaned = cleanMagicScript(rawInput);
            document.getElementById('prompter-text-area').innerHTML = cleaned;
            localStorage.setItem('tp_rise_script', rawInput);
            closeEditorModal();
            resetPrompter();
        }

        function saveAndApplyScript() {
            applyMagicWizardClean();
        }

        function stepPrompter() {
            if (!isPlaying) return;
            const viewport = document.getElementById('prompter-viewport');
            viewport.scrollTop += (scrollSpeed * 0.6);

            if (viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 10) {
                togglePlay();
            } else {
                animationFrameId = requestAnimationFrame(stepPrompter);
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const playIcon = document.getElementById('play-icon');
            const playText = document.getElementById('play-text');

            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause";
                playText.innerText = "PAUSAR";
                animationFrameId = requestAnimationFrame(stepPrompter);
                hideControls();
            } else {
                playIcon.className = "fa-solid fa-play";
                playText.innerText = "INICIAR";
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                showControls();
            }
        }

        function resetPrompter() {
            if (isPlaying) togglePlay();
            const viewport = document.getElementById('prompter-viewport');
            viewport.scrollTop = 0;
            showControls();
        }

        function adjustSpeed(amount) {
            scrollSpeed = Math.max(0.5, Math.min(5.0, scrollSpeed + amount));
            document.getElementById('speed-display').innerText = scrollSpeed.toFixed(1) + 'x';
        }

        function adjustFontSize(amount) {
            fontSize = Math.max(20, Math.min(64, fontSize + amount));
            document.getElementById('fontsize-display').innerText = fontSize;
            applyFontSize();
        }

        function applyFontSize() {
            const textArea = document.getElementById('prompter-text-area');
            textArea.style.fontSize = fontSize + 'px';
        }

        function setupTouchAndClickHandlers() {
            const viewport = document.getElementById('prompter-viewport');
            viewport.addEventListener('click', (e) => {
                if (controlsVisible) {
                    hideControls();
                } else {
                    showControls();
                    startHideControlsTimer();
                }
            });
        }

        function startHideControlsTimer() {
            if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
            if (isPlaying) {
                hideControlsTimeout = setTimeout(() => {
                    if (isPlaying) hideControls();
                }, 3000);
            }
        }

        function hideControls() {
            const controls = document.getElementById('action-controls');
            controls.classList.add('hidden-controls');
            controlsVisible = false;
        }

        function showControls() {
            const controls = document.getElementById('action-controls');
            controls.classList.remove('hidden-controls');
            controlsVisible = true;
        }

        function openEditorModal() {
            if (isPlaying) togglePlay();
            document.getElementById('editor-modal').classList.remove('hidden');
        }

        function closeEditorModal() {
            document.getElementById('editor-modal').classList.add('hidden');
        }

        function openMagicWizard() {
            openEditorModal();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Erro fullscreen: ", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
