<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TP RISE - Teleprompter Mágico</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        html, body {
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .teleprompter-text {
            line-height: 1.7;
            transform-origin: top center;
        }
        .scene-badge {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 6px 16px;
            border-radius: 9999px;
            font-weight: 700;
            display: inline-block;
            margin: 24px 0 12px 0;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            letter-spacing: 0.05em;
            font-size: 0.85em;
            text-transform: uppercase;
        }
        .spoken-word {
            background: rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .controls-fade {
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        .hidden-controls {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .reading-guide {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(99, 102, 241, 0.5);
            pointer-events: none;
            transform: translateY(-50%);
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.8);
            z-index: 20;
        }
        .reading-guide::before, .reading-guide::after {
            content: '';
            position: absolute;
            top: -4px;
            width: 0;
            height: 0;
            border-style: solid;
        }
        .reading-guide::before {
            left: 12px;
            border-width: 5px 0 5px 8px;
            border-color: transparent transparent transparent #6366f1;
        }
        .reading-guide::after {
            right: 12px;
            border-width: 5px 8px 5px 0;
            border-color: transparent #6366f1 transparent transparent;
        }
    </style>
</head>
<body class="w-screen h-screen overflow-hidden bg-[#0b0f19] select-none">

    <div id="app-container" class="relative w-full h-full flex flex-col justify-between overflow-hidden">

        <!-- Área de Exibição / Leitura do Teleprompter -->
        <div id="prompter-viewport" class="absolute inset-0 overflow-y-auto no-scrollbar px-6 py-20 flex flex-col items-center">
            <div class="w-full" style="height: 38vh;"></div>
            
            <div id="prompter-text-area" class="teleprompter-text w-full max-w-2xl text-left text-3xl md:text-5xl font-medium text-gray-100 space-y-8 pb-48">
                <!-- Conteúdo carregado dinamicamente -->
            </div>

            <div class="w-full" style="height: 50vh;"></div>
        </div>

        <div class="reading-guide"></div>

        <!-- Controles Flutuantes (Clean iOS Style) -->
        <div id="action-controls" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 md:p-6 z-50 controls-fade">
            
            <!-- Barra Superior Minimalista -->
            <div class="pointer-events-auto flex items-center justify-between bg-black/40 backdrop-blur-xl px-4 py-3 rounded-2xl border border-white/10 shadow-2xl">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                        <i class="fa-solid fa-wand-magic-sparkles text-white text-xs"></i>
                    </div>
                    <div>
                        <h1 class="text-xs font-bold tracking-wider text-white">TP RISE</h1>
                        <p class="text-[9px] text-indigo-300 font-medium">Agência RISE</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button onclick="toggleVoiceScroll()" id="mic-btn" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center text-white transition relative" title="Rolagem por Voz (Microfone)">
                        <i class="fa-solid fa-microphone text-xs" id="mic-icon"></i>
                        <span id="mic-pulse" class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full hidden animate-ping"></span>
                    </button>
                    <button onclick="openEditorModal()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center text-white transition" title="Editar Roteiro">
                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                    </button>
                    <button onclick="toggleFullscreen()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center text-white transition" title="Tela Cheia">
                        <i class="fa-solid fa-expand text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Barra Inferior de Ação (Clean iOS) -->
            <div class="pointer-events-auto flex flex-col space-y-3 bg-black/50 backdrop-blur-2xl p-4 rounded-3xl border border-white/10 shadow-2xl max-w-md mx-auto w-full">
                
                <div class="flex items-center justify-around px-2 text-xs text-gray-300">
                    <div class="flex items-center space-x-2">
                        <span class="text-indigo-400 font-semibold">Vel:</span>
                        <button onclick="adjustSpeed(-0.5)" class="w-7 h-7 bg-white/10 rounded-lg hover:bg-white/20 font-bold">-</button>
                        <span id="speed-display" class="w-8 text-center font-bold text-white">1.0x</span>
                        <button onclick="adjustSpeed(0.5)" class="w-7 h-7 bg-white/10 rounded-lg hover:bg-white/20 font-bold">+</button>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-indigo-400 font-semibold">Tam:</span>
                        <button onclick="adjustFontSize(-4)" class="w-7 h-7 bg-white/10 rounded-lg hover:bg-white/20 font-bold">-</button>
                        <span id="fontsize-display" class="w-8 text-center font-bold text-white">36</span>
                        <button onclick="adjustFontSize(4)" class="w-7 h-7 bg-white/10 rounded-lg hover:bg-white/20 font-bold">+</button>
                    </div>
                </div>

                <div class="flex items-center justify-center space-x-3">
                    <button onclick="resetPrompter()" class="w-12 h-12 rounded-2xl bg-white/10 hover:bg-white/20 active:scale-95 flex items-center justify-center text-white transition" title="Reiniciar">
                        <i class="fa-solid fa-rotate-left"></i>
                    </button>
                    
                    <button id="play-pause-btn" onclick="togglePlay()" class="flex-1 h-14 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 active:scale-95 flex items-center justify-center space-x-2 text-white font-bold text-base shadow-lg shadow-indigo-600/40 transition">
                        <i id="play-icon" class="fa-solid fa-play"></i>
                        <span id="play-text">INICIAR</span>
                    </button>

                    <button onclick="openEditorModal()" class="h-14 px-4 rounded-2xl bg-white/10 hover:bg-white/20 active:scale-95 flex items-center space-x-2 text-white font-bold transition" title="Roteiro">
                        <i class="fa-solid fa-file-lines"></i>
                    </button>
                </div>
            </div>

        </div>

        <!-- Modal de Editor & Roteiro Mágico -->
        <div id="editor-modal" class="absolute inset-0 bg-black/90 backdrop-blur-2xl z-[100] hidden flex flex-col p-4 md:p-8">
            <div class="flex items-center justify-between pb-4 border-b border-white/10">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 flex items-center justify-center">
                        <i class="fa-solid fa-wand-magic-sparkles text-white"></i>
                    </div>
                    <div>
                        <h2 class="text-base font-bold text-white">Editor de Roteiro Mágico</h2>
                        <p class="text-[11px] text-indigo-300">Cole seu texto com tags CENA ou ÁUDIO</p>
                    </div>
                </div>
                <button onclick="closeEditorModal()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 flex items-center justify-center text-white">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div class="flex-1 flex flex-col pt-4 overflow-hidden">
                <label class="text-xs font-semibold text-indigo-300 mb-2 flex justify-between items-center">
                    <span>COLE SEU ROTEIRO BRUTO ABAIXO:</span>
                    <button onclick="applyMagicWizardClean()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold shadow transition">
                        <i class="fa-solid fa-bolt mr-1"></i> Executar Roteiro Mágico
                    </button>
                </label>
                <textarea id="raw-script-input" class="flex-1 w-full bg-neutral-900 border border-white/10 rounded-2xl p-4 text-white text-sm focus:outline-none focus:border-indigo-500 resize-none font-mono" placeholder="Ex: [CENA 01] Olá pessoal..."></textarea>
            </div>

            <div class="flex justify-end pt-4 border-t border-white/10 space-x-3">
                <button onclick="closeEditorModal()" class="px-5 py-3 rounded-xl bg-white/10 hover:bg-white/20 font-bold text-sm text-white transition">Cancelar</button>
                <button onclick="saveAndApplyScript()" class="px-6 py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 font-bold text-sm text-white shadow-lg shadow-indigo-600/30 transition">Salvar e Carregar</button>
            </div>
        </div>

    </div>

    <script>
        let isPlaying = false;
        let scrollSpeed = 1.0;
        let fontSize = 36;
        let animationFrameId = null;
        let hideControlsTimeout = null;
        let controlsVisible = true;
        let recognition = null;
        let isVoiceActive = false;

        let defaultScript = `[CENA 01] Abertura
Seja muito bem-vindo ao TP RISE, o teleprompter profissional da Agência RISE.

[CENA 02] Roteiro Mágico
Com o nosso sistema inteligente, você cola seu roteiro e ele remove automaticamente todas as tags desnecessárias, exibindo apenas o texto puro para sua leitura perfeita.

[CENA 03] Controle por Voz
Ative o microfone no topo para que o teleprompter acompanhe a sua voz em tempo real enquanto você fala.`;

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedScript();
            setupTouchAndClickHandlers();
            startHideControlsTimer();
            applyFontSize();
            initSpeechRecognition();
        });

        function loadSavedScript() {
            const saved = localStorage.getItem('tp_rise_clean_script');
            if (saved) {
                renderPrompterContent(saved);
                document.getElementById('raw-script-input').value = saved;
            } else {
                renderPrompterContent(defaultScript);
                document.getElementById('raw-script-input').value = defaultScript;
            }
        }

        // Remove prefixos indesejados como 'Fala:', 'Áudio:', 'Locução:' e exibe apenas o texto puro
        function cleanMagicScript(rawText) {
            if (!rawText || typeof rawText !== 'string') return '';
            
            let lines = rawText.split('\n');
            let formattedHtml = '';

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;

                // Detecta tags de cena
                if (/^\[?(cena\s*\d+|cenas?\s*\d+)\]?/i.test(trimmed)) {
                    let sceneName = trimmed.replace(/[\[\]]/g, '');
                    formattedHtml += `<div class="w-full text-center my-6"><span class="scene-badge"><i class="fa-solid fa-clapperboard mr-2"></i>${escapeHtml(sceneName)}</span></div>`;
                } 
                else {
                    // Remove prefixos como Fala:, Áudio:, Audio:, Locução:, Voz:
                    let cleanedText = trimmed.replace(/^((fala|áudio|audio|locução|locucao|voz)\s*[:|-]\s*)/i, '').trim();
                    if (cleanedText) {
                        formattedHtml += `<p class="mb-6 text-gray-100">${escapeHtml(cleanedText)}</p>`;
                    }
                }
            });

            return formattedHtml;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function renderPrompterContent(text) {
            const container = document.getElementById('prompter-text-area');
            container.innerHTML = cleanMagicScript(text);
        }

        function applyMagicWizardClean() {
            const rawInput = document.getElementById('raw-script-input').value;
            const cleaned = cleanMagicScript(rawInput);
            document.getElementById('prompter-text-area').innerHTML = cleaned;
            localStorage.setItem('tp_rise_clean_script', rawInput);
            closeEditorModal();
            resetPrompter();
        }

        function saveAndApplyScript() {
            applyMagicWizardClean();
        }

        function stepPrompter() {
            if (!isPlaying) return;
            const viewport = document.getElementById('prompter-viewport');
            viewport.scrollTop += (scrollSpeed * 0.6);

            if (viewport.scrollTop + viewport.clientHeight >= viewport.scrollHeight - 10) {
                togglePlay();
            } else {
                animationFrameId = requestAnimationFrame(stepPrompter);
            }
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            const playIcon = document.getElementById('play-icon');
            const playText = document.getElementById('play-text');

            if (isPlaying) {
                playIcon.className = "fa-solid fa-pause";
                playText.innerText = "PAUSAR";
                if (!isVoiceActive) {
                    animationFrameId = requestAnimationFrame(stepPrompter);
                }
                hideControls();
            } else {
                playIcon.className = "fa-solid fa-play";
                playText.innerText = "INICIAR";
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                showControls();
            }
        }

        function resetPrompter() {
            if (isPlaying) togglePlay();
            const viewport = document.getElementById('prompter-viewport');
            viewport.scrollTop = 0;
            showControls();
        }

        function adjustSpeed(amount) {
            scrollSpeed = Math.max(0.5, Math.min(5.0, scrollSpeed + amount));
            document.getElementById('speed-display').innerText = scrollSpeed.toFixed(1) + 'x';
        }

        function adjustFontSize(amount) {
            fontSize = Math.max(20, Math.min(64, fontSize + amount));
            document.getElementById('fontsize-display').innerText = fontSize;
            applyFontSize();
        }

        function applyFontSize() {
            const textArea = document.getElementById('prompter-text-area');
            textArea.style.fontSize = fontSize + 'px';
        }

        function setupTouchAndClickHandlers() {
            const viewport = document.getElementById('prompter-viewport');
            viewport.addEventListener('click', (e) => {
                if (controlsVisible) {
                    hideControls();
                } else {
                    showControls();
                    startHideControlsTimer();
                }
            });
        }

        function startHideControlsTimer() {
            if (hideControlsTimeout) clearTimeout(hideControlsTimeout);
            if (isPlaying) {
                hideControlsTimeout = setTimeout(() => {
                    if (isPlaying) hideControls();
                }, 3000);
            }
        }

        function hideControls() {
            const controls = document.getElementById('action-controls');
            controls.classList.add('hidden-controls');
            controlsVisible = false;
        }

        function showControls() {
            const controls = document.getElementById('action-controls');
            controls.classList.remove('hidden-controls');
            controlsVisible = true;
        }

        function openEditorModal() {
            if (isPlaying) togglePlay();
            document.getElementById('editor-modal').classList.remove('hidden');
        }

        function closeEditorModal() {
            document.getElementById('editor-modal').classList.add('hidden');
        }

        // Web Speech API para rolagem por voz em tempo real
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.log("Speech Recognition não suportado neste navegador.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'pt-BR';

            recognition.onresult = (event) => {
                if (!isPlaying) return;
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                transcript = transcript.trim().toLowerCase();
                if (transcript.length > 2) {
                    matchAndScrollSpeech(transcript);
                }
            };

            recognition.onerror = (event) => {
                console.log("Erro no reconhecimento de voz:", event.error);
            };

            recognition.onend = () => {
                if (isVoiceActive && isPlaying) {
                    try { recognition.start(); } catch(e){}
                }
            };
        }

        function toggleVoiceScroll() {
            if (!recognition) {
                alert("O reconhecimento de voz não é suportado neste dispositivo/navegador.");
                return;
            }

            isVoiceActive = !isVoiceActive;
            const micBtn = document.getElementById('mic-btn');
            const micPulse = document.getElementById('mic-pulse');
            const micIcon = document.getElementById('mic-icon');

            if (isVoiceActive) {
                try {
                    recognition.start();
                    micBtn.classList.add('bg-indigo-600', 'border-indigo-400');
                    micPulse.classList.remove('hidden');
                    micIcon.className = "fa-solid fa-microphone text-xs text-white";
                } catch(e) {
                    console.log(e);
                }
            } else {
                try { recognition.stop(); } catch(e){}
                micBtn.classList.remove('bg-indigo-600', 'border-indigo-400');
                micPulse.classList.add('hidden');
                micIcon.className = "fa-solid fa-microphone text-xs";
            }
        }

        function matchAndScrollSpeech(spokenText) {
            const paragraphs = document.querySelectorAll('#prompter-text-area p');
            paragraphs.forEach(p => {
                let text = p.innerText.toLowerCase();
                if (text.includes(spokenText)) {
                    p.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        // Fullscreen API para abrir em tela cheia total
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Erro ao tentar entrar em tela cheia:", err);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
