<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TP RISE - Teleprompter</title>
    <!-- Tailwind CSS (Clean Theme) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        html, body {
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Estilos do Texto do Prompter */
        .mirror-text {
            transform: scaleX(-1);
        }

        .tp-word {
            opacity: 0.3; /* Começa apagado */
            color: #a3a3a3; /* Cinza claro */
            transition: opacity 0.2s ease, color 0.2s ease;
            display: inline-block;
            margin-right: 0.25rem;
        }

        .word-spoken {
            opacity: 1 !important;
            color: #ffffff !important; /* Clareia para branco ao falar */
        }
        
        .fim-de-texto {
            color: #ef4444 !important; /* Vermelho */
            font-weight: bold;
            opacity: 1;
        }

        /* Transições de Interface */
        .fade-in { animation: fadeIn 0.4s ease forwards; }
        .fade-out { animation: fadeOut 0.4s ease forwards; }
        
        @keyframes fadeIn { from { opacity: 0; visibility: hidden; } to { opacity: 1; visibility: visible; } }
        @keyframes fadeOut { from { opacity: 1; visibility: visible; } to { opacity: 0; visibility: hidden; } }

        .hidden-controls {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .visible-controls {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.4s ease;
        }
    </style>
</head>
<body class="w-screen h-screen bg-black text-white flex flex-col items-center justify-center relative">

    <!-- MODAL DE DOAÇÃO (Início) -->
    <div id="donation-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[200] hidden flex-col items-center justify-center p-6">
        <div class="bg-neutral-900 border border-neutral-800 rounded-3xl p-6 md:p-8 max-w-md w-full text-center shadow-2xl flex flex-col items-center">
            <div class="w-12 h-12 bg-neutral-800 rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-hand-holding-heart text-white text-xl"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2 leading-tight">Apoie a criação de novos sistemas para o audiovisual</h2>
            <p class="text-neutral-400 text-sm mb-4 leading-relaxed">Esta colaboração é 100% opcional! Se não quiser ou não puder ajudar agora, basta fechar e usar o app normalmente.</p>
            
            <div class="bg-white rounded-2xl p-2 mb-4">
                <img src="image_cb510f.jpg" alt="QR Code PIX" style="width: 200px; height: 200px; border-radius: 12px; margin: 15px auto; display: block; border: 2px solid #333;">
            </div>
            
            <p class="text-xs text-neutral-500 mb-2 uppercase tracking-widest">Responsável: Cleverton</p>
            
            <div class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 flex items-center justify-between mb-6">
                <span class="text-neutral-300 text-xs font-mono truncate mr-2 flex-1 text-left" id="pix-key">f8d38943-0d16-466c-b0cb-02518a2396c2</span>
                <button onclick="copyPix()" class="bg-neutral-800 hover:bg-neutral-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition active:scale-95 whitespace-nowrap">
                    <i class="fa-regular fa-copy mr-1"></i> Copiar
                </button>
            </div>
            <span id="copy-feedback" class="text-green-400 text-xs font-bold mb-4 hidden">Chave copiada com sucesso!</span>

            <button onclick="closeDonationModal()" class="w-full bg-white hover:bg-gray-200 text-black font-bold py-3.5 rounded-xl transition active:scale-95">
                Entrar no App (Opcional/Gratuito)
            </button>
        </div>
    </div>

    <!-- TELA INICIAL (Editor de Roteiro) -->
    <div id="setup-screen" class="w-full h-full flex flex-col p-4 md:p-8 max-w-4xl mx-auto z-10 fade-in">
        <header class="flex items-center justify-between pb-6 border-b border-neutral-800">
            <div>
                <h1 class="text-xl font-bold tracking-widest uppercase">TP RISE</h1>
                <p class="text-neutral-500 text-xs">Professional Teleprompter</p>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="clearScript()" class="text-neutral-400 hover:text-white transition text-sm">Limpar</button>
            </div>
        </header>

        <main class="flex-1 flex flex-col pt-6 overflow-hidden">
            <label class="text-xs font-bold text-neutral-400 uppercase tracking-widest mb-2">Seu Roteiro</label>
            <textarea id="script-input" class="flex-1 w-full bg-neutral-900/50 border border-neutral-800 rounded-2xl p-6 text-white text-lg focus:outline-none focus:border-neutral-500 resize-none font-sans" placeholder="Cole seu texto aqui..."></textarea>
        </main>

        <footer class="pt-6 border-t border-neutral-800 grid grid-cols-2 gap-4">
            <button onclick="startPrompter()" class="col-span-2 md:col-span-1 py-4 rounded-2xl bg-white hover:bg-gray-200 text-black font-bold text-sm uppercase tracking-widest transition shadow-lg active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-play"></i>
                <span>Iniciar Leitura</span>
            </button>
            <button onclick="startPrompter(true)" class="col-span-2 md:col-span-1 py-4 rounded-2xl bg-neutral-800 hover:bg-neutral-700 text-white font-bold text-sm uppercase tracking-widest transition shadow-lg active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-video"></i>
                <span>Gravar Selfie</span>
            </button>
        </footer>
    </div>

    <!-- TELA DE LEITURA (Teleprompter) -->
    <div id="prompter-screen" class="absolute inset-0 bg-black z-50 hidden flex-col items-center">
        
        <!-- Câmera Frontal PIP (Oculta por padrão) -->
        <video id="selfie-video" class="absolute top-6 right-6 w-28 md:w-40 aspect-[3/4] object-cover rounded-2xl border-2 border-neutral-800 z-[100] hidden shadow-2xl bg-neutral-900" autoplay muted playsinline></video>
        <div id="recording-indicator" class="absolute top-8 right-8 z-[101] hidden items-center space-x-2 bg-black/60 backdrop-blur-md px-2 py-1 rounded-md">
            <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
            <span class="text-[10px] font-bold text-white uppercase tracking-widest" id="recording-time">00:00</span>
        </div>

        <!-- Área de Rolagem do Texto -->
        <div id="prompter-viewport" class="absolute inset-0 overflow-y-auto no-scrollbar px-6 md:px-12 flex flex-col items-center">
            <div class="w-full shrink-0" style="height: 40vh;"></div>
            
            <div id="prompter-text-container" class="w-full flex justify-center transition-transform duration-300">
                <div id="prompter-text-area" class="w-full max-w-4xl text-left text-4xl md:text-5xl font-bold leading-relaxed space-y-8" style="font-size: 44px;">
                    <!-- Palavras renderizadas -->
                </div>
            </div>

            <div class="w-full shrink-0" style="height: 60vh;"></div>
        </div>

        <!-- Controles Sobrepostos (HUD) -->
        <div id="prompter-hud" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-6 z-[60] visible-controls">
            <!-- Top Bar -->
            <div class="flex items-start justify-between pointer-events-auto">
                <button onclick="stopPrompter()" class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-neutral-800 flex items-center justify-center text-white hover:bg-neutral-800 transition active:scale-95">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <div class="flex space-x-3">
                    <button onclick="toggleFullscreen()" class="w-12 h-12 rounded-full bg-neutral-900/80 backdrop-blur-md border border-neutral-800 flex items-center justify-center text-white hover:bg-neutral-800 transition active:scale-95" title="Tela Cheia">
                        <i class="fa-solid fa-expand text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="pointer-events-auto bg-neutral-900/90 backdrop-blur-xl p-2 rounded-3xl border border-neutral-800 max-w-lg w-full mx-auto shadow-2xl flex items-center justify-between">
                
                <button onclick="toggleMirror()" id="btn-mirror" class="flex-1 py-4 mx-1 rounded-2xl bg-transparent hover:bg-neutral-800 text-white font-bold text-xs uppercase tracking-widest transition flex flex-col items-center space-y-1 active:scale-95">
                    <i class="fa-solid fa-clock-rotate-left text-lg"></i>
                    <span>Espelhar</span>
                </button>

                <button onclick="adjustFontSize(-4)" class="w-14 py-4 mx-1 rounded-2xl bg-neutral-800 hover:bg-neutral-700 text-white font-bold transition active:scale-95 flex items-center justify-center">
                    A-
                </button>
                <button onclick="adjustFontSize(4)" class="w-14 py-4 mx-1 rounded-2xl bg-neutral-800 hover:bg-neutral-700 text-white font-bold transition active:scale-95 flex items-center justify-center">
                    A+
                </button>

                <button id="btn-voice" onclick="toggleVoice()" class="flex-1 py-4 mx-1 rounded-2xl bg-white text-black hover:bg-gray-200 font-bold text-xs uppercase tracking-widest transition flex flex-col items-center space-y-1 shadow-lg active:scale-95">
                    <i id="voice-icon" class="fa-solid fa-microphone-lines text-lg"></i>
                    <span id="voice-text">Ouvir Voz</span>
                </button>

                <!-- Botão de Gravação (Aparece se iniciado no modo Selfie) -->
                <button id="btn-record" onclick="toggleRecording()" class="flex-1 py-4 mx-1 rounded-2xl bg-red-600 text-white hover:bg-red-500 font-bold text-xs uppercase tracking-widest transition flex flex-col items-center space-y-1 shadow-lg active:scale-95 hidden">
                    <i id="record-icon" class="fa-solid fa-circle text-lg"></i>
                    <span id="record-text">Gravar</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts da Aplicação -->
    <script>
        // === VARIÁVEIS GLOBAIS ===
        let fontSize = 44;
        let isVoiceActive = false;
        let recognition = null;
        let wordSpans = [];
        let currentWordIndex = 0;
        let controlsTimeout = null;
        let lastScrollTop = 0;
        
        // Câmera & Gravação
        let isSelfieMode = false;
        let isRecording = false;
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let recordTimer = null;
        let recordSeconds = 0;

        // === INICIALIZAÇÃO E MODAL DE DOAÇÃO ===
        window.addEventListener('DOMContentLoaded', () => {
            const hasSeenDonation = localStorage.getItem('donation_seen');
            if (!hasSeenDonation) {
                document.getElementById('donation-modal').classList.remove('hidden');
                document.getElementById('donation-modal').classList.add('flex');
            }

            // Restaurar texto salvo
            const savedText = localStorage.getItem('tp_rise_script');
            if (savedText) {
                document.getElementById('script-input').value = savedText;
            }

            // Gerenciamento do HUD no prompter
            document.getElementById('prompter-viewport').addEventListener('click', resetControlsTimeout);
        });

        function closeDonationModal() {
            localStorage.setItem('donation_seen', 'true');
            document.getElementById('donation-modal').classList.add('hidden');
            document.getElementById('donation-modal').classList.remove('flex');
        }

        function copyPix() {
            const pixKey = "f8d38943-0d16-466c-b0cb-02518a2396c2";
            navigator.clipboard.writeText(pixKey).then(() => {
                const feedback = document.getElementById('copy-feedback');
                feedback.classList.remove('hidden');
                setTimeout(() => feedback.classList.add('hidden'), 3000);
            }).catch(err => {
                // Fallback
                const textArea = document.createElement("textarea");
                textArea.value = pixKey;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                const feedback = document.getElementById('copy-feedback');
                feedback.classList.remove('hidden');
                setTimeout(() => feedback.classList.add('hidden'), 3000);
            });
        }

        // === GERENCIAMENTO DE ROTEIRO ===
        function clearScript() {
            document.getElementById('script-input').value = '';
            localStorage.removeItem('tp_rise_script');
        }

        function parseScript(rawText) {
            if (!rawText.trim()) return;
            
            let lines = rawText.split('\n');
            let html = '';

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;
                // Divide em palavras, embaladas em spans (iniciam apagadas via CSS)
                let wordsHtml = trimmed.split(/\s+/).map(w => `<span class="tp-word">${escapeHtml(w)}</span>`).join(' ');
                html += `<p class="mb-8">${wordsHtml}</p>`;
            });

            // Adicionar FIM DE TEXTO em vermelho
            html += `<p class="mb-8 text-center mt-16"><span class="tp-word fim-de-texto tracking-widest text-2xl">FIM DE TEXTO</span></p>`;
            
            document.getElementById('prompter-text-area').innerHTML = html;
            wordSpans = Array.from(document.querySelectorAll('.tp-word'));
            currentWordIndex = 0;
            lastScrollTop = 0;
            document.getElementById('prompter-viewport').scrollTop = 0;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function adjustFontSize(amount) {
            fontSize = Math.max(24, Math.min(90, fontSize + amount));
            document.getElementById('prompter-text-area').style.fontSize = fontSize + 'px';
        }

        // === CONTROLE DO PROMPTER (INICIAR/PARAR) ===
        async function startPrompter(withCamera = false) {
            const rawText = document.getElementById('script-input').value;
            if (!rawText.trim()) return alert("Por favor, insira um roteiro antes de iniciar.");
            
            localStorage.setItem('tp_rise_script', rawText);
            parseScript(rawText);

            document.getElementById('setup-screen').classList.replace('fade-in', 'fade-out');
            setTimeout(() => {
                document.getElementById('setup-screen').classList.add('hidden');
                document.getElementById('prompter-screen').classList.remove('hidden');
                document.getElementById('prompter-screen').classList.add('flex', 'fade-in');
            }, 400);

            resetControlsTimeout();
            initSpeechRecognition();

            isSelfieMode = withCamera;
            const btnRecord = document.getElementById('btn-record');
            const videoElement = document.getElementById('selfie-video');

            if (withCamera) {
                btnRecord.classList.remove('hidden');
                videoElement.classList.remove('hidden');
                await startCamera();
            } else {
                btnRecord.classList.add('hidden');
                videoElement.classList.add('hidden');
            }
        }

        function stopPrompter() {
            // Desliga voz
            if (isVoiceActive) toggleVoice();
            if (recognition) {
                try { recognition.stop(); } catch(e){}
                recognition = null;
            }

            // Para gravação e câmera
            if (isRecording) toggleRecording();
            stopCamera();

            // Sai de tela cheia se estiver
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(e => console.log(e));
            }

            document.getElementById('prompter-screen').classList.replace('fade-in', 'fade-out');
            setTimeout(() => {
                document.getElementById('prompter-screen').classList.add('hidden');
                document.getElementById('prompter-screen').classList.remove('flex', 'fade-out');
                
                document.getElementById('setup-screen').classList.remove('hidden', 'fade-out');
                document.getElementById('setup-screen').classList.add('fade-in');
            }, 400);
        }

        // === RECONHECIMENTO DE VOZ (Sincronização Perfeita) ===
        function initSpeechRecognition() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRec) {
                alert("Seu navegador não suporta reconhecimento de voz embutido. Use o Chrome ou Safari atualizado.");
                return;
            }

            recognition = new SpeechRec();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'pt-BR';

            recognition.onresult = (event) => {
                if (!isVoiceActive) return;
                
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    interimTranscript += event.results[i][0].transcript;
                }
                matchVoiceToText(interimTranscript.trim().toLowerCase());
            };

            recognition.onend = () => {
                // Reinicia se foi pausado pelo sistema mas deveria estar ativo
                if (isVoiceActive) {
                    try { recognition.start(); } catch(e){}
                }
            };
        }

        function matchVoiceToText(spokenPhrase) {
            if (!spokenPhrase || currentWordIndex >= wordSpans.length - 1) return; // -1 ignora FIM DE TEXTO

            let spokenWords = spokenPhrase.split(/\s+/);
            let latestSpokenWord = spokenWords[spokenWords.length - 1].replace(/[.,!?;:]/g, '');
            
            // Busca nas próximas 10 palavras para evitar saltos distantes
            let lookaheadLimit = Math.min(currentWordIndex + 10, wordSpans.length - 1);
            
            for (let i = currentWordIndex; i < lookaheadLimit; i++) {
                let textWord = wordSpans[i].innerText.toLowerCase().replace(/[.,!?;:]/g, '');
                
                if (textWord === latestSpokenWord) {
                    // Marca as palavras lidas (clareando)
                    for (let j = currentWordIndex; j <= i; j++) {
                        wordSpans[j].classList.add('word-spoken');
                    }
                    currentWordIndex = i + 1;
                    
                    // Rolagem Suave sem saltos bruscos
                    const viewport = document.getElementById('prompter-viewport');
                    const activeWord = wordSpans[i];
                    
                    // Calcula a posição do elemento em relação ao container
                    const targetScrollTop = activeWord.offsetTop - (viewport.clientHeight / 2.5);
                    
                    // Só rola para baixo (nunca sobe se o erro jogar pra trás)
                    if (targetScrollTop > viewport.scrollTop) {
                        viewport.scrollTo({
                            top: targetScrollTop,
                            behavior: 'smooth'
                        });
                    }
                    break;
                }
            }
        }

        function toggleVoice() {
            if (!recognition) return;

            isVoiceActive = !isVoiceActive;
            const voiceIcon = document.getElementById('voice-icon');
            const voiceText = document.getElementById('voice-text');
            const btnVoice = document.getElementById('btn-voice');

            if (isVoiceActive) {
                try { recognition.start(); } catch(e){}
                voiceIcon.className = "fa-solid fa-microphone-slash text-lg";
                voiceText.innerText = "Pausar Voz";
                btnVoice.classList.remove('bg-white', 'text-black');
                btnVoice.classList.add('bg-neutral-700', 'text-white');
                resetControlsTimeout(); 
            } else {
                try { recognition.stop(); } catch(e){}
                voiceIcon.className = "fa-solid fa-microphone-lines text-lg";
                voiceText.innerText = "Ouvir Voz";
                btnVoice.classList.remove('bg-neutral-700', 'text-white');
                btnVoice.classList.add('bg-white', 'text-black');
                showControlsHUD(); 
            }
        }

        // Bloqueio de Segurança: Desliga microfone ao sair ou minimizar
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden' && isVoiceActive) {
                toggleVoice(); 
            }
        });
        window.addEventListener('beforeunload', () => {
            if (recognition) { isVoiceActive = false; try { recognition.stop(); } catch(e){} }
            stopCamera();
        });

        // === CÂMERA E GRAVAÇÃO DE SELFIE ===
        async function startCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: true 
                });
                const video = document.getElementById('selfie-video');
                video.srcObject = mediaStream;
            } catch (err) {
                console.error("Erro ao acessar câmera:", err);
                alert("Não foi possível acessar a câmera. Verifique as permissões do navegador.");
                document.getElementById('btn-record').classList.add('hidden');
            }
        }

        function stopCamera() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            document.getElementById('selfie-video').srcObject = null;
        }

        function toggleRecording() {
            const recordIcon = document.getElementById('record-icon');
            const recordText = document.getElementById('record-text');
            const indicator = document.getElementById('recording-indicator');
            const timeDisplay = document.getElementById('recording-time');

            if (!isRecording) {
                // Iniciar Gravação
                if (!mediaStream) return;
                recordedChunks = [];
                
                let options = { mimeType: 'video/webm;codecs=vp9,opus' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm;codecs=vp8,opus' }; // Fallback
                    if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                        options = { mimeType: 'video/mp4' }; // Safari fallback
                    }
                }

                try {
                    mediaRecorder = new MediaRecorder(mediaStream, options);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(mediaStream);
                }

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `TP_RISE_Gravacao_${new Date().getTime()}.${mediaRecorder.mimeType.includes('mp4') ? 'mp4' : 'webm'}`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                    }, 100);
                };

                mediaRecorder.start();
                isRecording = true;
                
                // UI Atualiza
                recordIcon.className = "fa-solid fa-stop text-lg";
                recordText.innerText = "Parar";
                indicator.classList.remove('hidden');
                indicator.classList.add('flex');
                
                recordSeconds = 0;
                timeDisplay.innerText = "00:00";
                recordTimer = setInterval(() => {
                    recordSeconds++;
                    const m = String(Math.floor(recordSeconds / 60)).padStart(2, '0');
                    const s = String(recordSeconds % 60).padStart(2, '0');
                    timeDisplay.innerText = `${m}:${s}`;
                }, 1000);

                resetControlsTimeout(); // Esconde controles para gravar limpo

            } else {
                // Parar Gravação
                mediaRecorder.stop();
                isRecording = false;
                clearInterval(recordTimer);
                
                // UI Atualiza
                recordIcon.className = "fa-solid fa-circle text-lg";
                recordText.innerText = "Gravar";
                indicator.classList.add('hidden');
                indicator.classList.remove('flex');
                showControlsHUD();
            }
        }

        // === ESPELHAR TEXTO (Modo Vidro) ===
        function toggleMirror() {
            const container = document.getElementById('prompter-text-container');
            container.classList.toggle('mirror-text');
            
            const btn = document.getElementById('btn-mirror');
            if (container.classList.contains('mirror-text')) {
                btn.classList.add('bg-white', 'text-black');
            } else {
                btn.classList.remove('bg-white', 'text-black');
            }
        }

        // === TELA CHEIA E ROTAÇÃO PAISAGEM ===
        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                    
                    // Força a tela a deitar (Horizontal) no Mobile
                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(e => {
                            console.warn("Bloqueio de orientação ignorado pelo dispositivo.", e);
                        });
                    }
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                        if (screen.orientation && screen.orientation.unlock) {
                            screen.orientation.unlock();
                        }
                    }
                }
            } catch (err) {
                console.error("Erro no modo tela cheia:", err);
            }
        }

        // === CONTROLES HUD (Esconder e Mostrar) ===
        function resetControlsTimeout() {
            showControlsHUD();
            clearTimeout(controlsTimeout);
            // Só esconde automaticamente se estiver rodando a voz ou gravando
            if (isVoiceActive || isRecording) {
                controlsTimeout = setTimeout(hideControlsHUD, 4000);
            }
        }

        function showControlsHUD() { 
            const hud = document.getElementById('prompter-hud');
            hud.classList.remove('hidden-controls');
            hud.classList.add('visible-controls');
        }
        
        function hideControlsHUD() { 
            const hud = document.getElementById('prompter-hud');
            hud.classList.remove('visible-controls');
            hud.classList.add('hidden-controls');
        }
    </script>
</body>
</html>
